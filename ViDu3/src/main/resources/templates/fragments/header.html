<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand text-warning" th:href="@{/}">
            <i class="bi bi-shop me-2"></i>IOTSTAR SHOP
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang Chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam me-1"></i> Sản Phẩm</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a class="nav-link text-info" th:href="@{/users}"><i class="bi bi-people me-1"></i> Quản Lý User</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center text-white gap-2">
                    <span class="badge bg-warning text-dark me-1" sec:authentication="principal.authorities[0]">ROLE</span>
                    <span class="fw-semibold" sec:authentication="principal.fullName">User Name</span>
                    <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                        <button class="btn btn-outline-danger btn-sm" type="submit">
                            <i class="bi bi-box-arrow-right"></i> Đăng xuất
                        </button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập</a>
                    <a th:href="@{/register}" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Đăng Ký</a>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
