<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quên Mật Khẩu</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-key me-2"></i>Quên Mật Khẩu</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Nhập email tài khoản của bạn</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid" placeholder="example@gmail.com" required autofocus>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger">Gửi Mã Xác Nhận OTP</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-white py-3">
                    <a th:href="@{/login}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
