<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Xác Thực OTP</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-warning text-dark text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Xác Thực Mã OTP</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email nhận OTP</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="otp" class="form-label">Nhập 6 số OTP</label>
                            <input type="text" class="form-control text-center fs-4 letter-spacing-2" id="otp" maxlength="6" th:field="*{otp}" th:errorclass="is-invalid" placeholder="123456" autofocus>
                            <div class="invalid-feedback" th:errors="*{otp}"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning font-weight-bold">Xác Nhận OTP</button>
                        </div>
                    </form>

                    <hr>
                    <form th:action="@{/resend-register-otp}" method="post" class="text-center">
                        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                        <button type="submit" class="btn btn-link btn-sm text-decoration-none">Chưa nhận được mã? Gửi lại OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
