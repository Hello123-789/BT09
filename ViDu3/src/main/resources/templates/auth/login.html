<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đăng Nhập</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Tên đăng nhập / Email hoặc mật khẩu không chính xác.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>Bạn đã đăng xuất thành công.
                    </div>
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Success</span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Tên đăng nhập hoặc Email</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Nhập username hoặc email" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label font-weight-bold">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <a th:href="@{/forgot-password}" class="text-decoration-none small text-muted">Quên mật khẩu?</a>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-block">Đăng Nhập</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-white py-3">
                    <span class="text-muted">Chưa có tài khoản?</span>
                    <a th:href="@{/register}" class="fw-bold text-decoration-none">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
