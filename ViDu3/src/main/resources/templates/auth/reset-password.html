<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đặt Lại Mật Khẩu</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi bi-shield-check me-2"></i>Đặt Lại Mật Khẩu</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email tài khoản</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}">
                        </div>

                        <div class="mb-3">
                            <label for="otp" class="form-label">Mã OTP (6 chữ số đã gửi mail)</label>
                            <input type="text" class="form-control" id="otp" name="otp" maxlength="6" required placeholder="123456" autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-danger">Đổi Mật Khẩu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
