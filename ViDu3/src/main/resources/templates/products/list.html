<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh Sách Sản Phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box-seam me-2"></i>Quản Lý Sản Phẩm</h2>
        <a th:href="@{/products/create}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Thêm Sản Phẩm</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/products}" method="get" class="row g-3">
                <div class="col-md-8">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên sản phẩm, thương hiệu...">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-search me-1"></i>Tìm Kiếm</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Hình Ảnh</th>
                    <th>Tên Sản Phẩm</th>
                    <th>Thương Hiệu</th>
                    <th>Danh Mục</th>
                    <th>Giá Bán</th>
                    <th>Số Lượng</th>
                    <th>Người Tạo</th>
                    <th class="text-center">Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products.content}">
                    <td th:text="${p.id}">1</td>
                    <td>
                        <img th:if="${p.imageUrl != null}" th:src="@{${p.imageUrl}}" alt="Product" style="width: 50px; height: 50px; object-fit: cover;" class="rounded border">
                        <span th:if="${p.imageUrl == null}" class="text-muted small">Chưa có ảnh</span>
                    </td>
                    <td class="fw-bold" th:text="${p.name}">Tên sản phẩm</td>
                    <td th:text="${p.brand != null ? p.brand : '-'}">Thương hiệu</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${p.categoryName != null ? p.categoryName : 'Không có'}">Danh mục</span>
                    </td>
                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                    <td th:text="${p.quantity != null ? p.quantity : 0}">0</td>
                    <td th:text="${p.username != null ? p.username : '-'}">admin</td>
                    <td class="text-center">
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil"></i> Sửa
                        </a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${products.totalElements == 0}">
                    <td colspan="9" class="text-center text-muted py-4">Không có sản phẩm nào.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${products.totalPages > 1}">
            <span class="text-muted small">
                Trang <strong th:text="${products.number + 1}">1</strong> / <strong th:text="${products.totalPages}">1</strong> (Tổng <span th:text="${products.totalElements}">0</span> sản phẩm)
            </span>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!products.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${products.number - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${i == products.number} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!products.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${products.number + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
