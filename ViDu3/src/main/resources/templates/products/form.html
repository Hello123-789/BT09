<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm Sản Phẩm Mới' : 'Chỉnh Sửa Sản Phẩm'}">Sản Phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">
                        <i class="bi" th:classappend="${mode == 'create' ? 'bi-plus-circle' : 'bi-pencil-square'}"></i>
                        <span th:text="${mode == 'create' ? 'Thêm Sản Phẩm Mới' : 'Chỉnh Sửa Sản Phẩm'}">Form</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${mode == 'create'} ? @{/products/create} : @{/products/edit/{id}(id=${productDTO.id})}"
                          th:object="${productDTO}" method="post" enctype="multipart/form-data">
                        
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" placeholder="Nhập tên sản phẩm" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="brand" class="form-label">Thương hiệu</label>
                                <input type="text" class="form-control" id="brand" th:field="*{brand}" placeholder="Yonex, Lining, Victor...">
                            </div>
                            <div class="col-md-6">
                                <label for="categoryId" class="form-label">Danh mục</label>
                                <select class="form-select" id="categoryId" th:field="*{categoryId}">
                                    <option value="">-- Chọn Danh Mục --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}">Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="price" class="form-label">Giá bán (VNĐ)</label>
                                <input type="number" step="1000" class="form-control" id="price" th:field="*{price}" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="quantity" class="form-label">Số lượng tồn kho</label>
                                <input type="number" class="form-control" id="quantity" th:field="*{quantity}" min="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Mô tả sản phẩm</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Nhập chi tiết về sản phẩm..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">Hình ảnh sản phẩm (Upload Cloudinary / Local)</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <div class="mt-2" th:if="${productDTO.imageUrl != null}">
                                <span class="text-muted small d-block">Ảnh hiện tại:</span>
                                <img th:src="${#strings.contains(productDTO.imageUrl, '|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}" alt="Current Image" style="max-height: 100px; object-fit: cover;" class="rounded border mt-1">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3">
                            <a th:href="@{/products}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${mode == 'create' ? 'Tạo Sản Phẩm' : 'Lưu Thay Đổi'}">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
