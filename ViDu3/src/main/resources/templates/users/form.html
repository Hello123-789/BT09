<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${mode == 'create' ? 'Thêm Người Dùng' : 'Chỉnh Sửa Người Dùng'}">Người Dùng</title>
</head>
<body>
<main layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">
                        <i class="bi" th:classappend="${mode == 'create' ? 'bi-person-plus' : 'bi-pencil-square'}"></i>
                        <span th:text="${mode == 'create' ? 'Thêm Người Dùng Mới' : 'Chỉnh Sửa Người Dùng'}">Form</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}"
                          th:object="${userDTO}" method="post">
                        
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" th:readonly="${mode == 'edit'}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="roleName" class="form-label">Vai trò (Role)</label>
                            <select class="form-select" id="roleName" th:field="*{roleName}">
                                <option value="ROLE_USER">ROLE_USER (Người dùng thông thường)</option>
                                <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên)</option>
                            </select>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="enabled" th:field="*{enabled}">
                            <label class="form-check-label" for="enabled">Kích hoạt tài khoản</label>
                        </div>

                        <div th:if="${mode == 'create'}" class="alert alert-info">
                            <i class="bi bi-info-circle me-1"></i> Mật khẩu mặc định khi tạo mới là <strong>123456</strong>.
                        </div>

                        <div class="d-flex justify-content-between pt-3">
                            <a th:href="@{/users}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${mode == 'create' ? 'Tạo Mới' : 'Lưu Thay Đổi'}">Lưu</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
