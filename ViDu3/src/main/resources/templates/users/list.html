<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh Sách Người Dùng</title>
</head>
<body>
<main layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people me-2"></i>Quản Lý Người Dùng</h2>
        <a th:href="@{/users/create}" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Thêm Người Dùng</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/users}" method="get" class="row g-3">
                <div class="col-md-8">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo username, email, hoặc họ tên...">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary flex-grow-1"><i class="bi bi-search me-1"></i>Tìm Kiếm</button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th>Vai Trò</th>
                    <th>Số Sản Phẩm</th>
                    <th>Trạng Thái</th>
                    <th class="text-center">Thao Tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.id}">1</td>
                    <td class="fw-bold" th:text="${user.username}">username</td>
                    <td th:text="${user.fullName}">Họ Tên</td>
                    <td th:text="${user.email}">email@example.com</td>
                    <td>
                        <span class="badge" th:classappend="${user.roleName == 'ROLE_ADMIN' ? 'bg-danger' : 'bg-info'}" th:text="${user.roleName}">ROLE_USER</span>
                    </td>
                    <td>
                        <span class="badge bg-secondary" th:text="${user.productCount}">0</span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-secondary'}" th:text="${user.enabled ? 'Kích hoạt' : 'Khóa'}">Kích hoạt</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil"></i> Sửa
                        </a>
                        <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.totalElements == 0}">
                    <td colspan="8" class="text-center text-muted py-4">Không tìm thấy người dùng nào.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${users.totalPages > 1}">
            <span class="text-muted small">
                Hiển thị trang <strong th:text="${users.number + 1}">1</strong> / <strong th:text="${users.totalPages}">1</strong> (Tổng <span th:text="${users.totalElements}">0</span> người dùng)
            </span>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${!users.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/users(page=${users.number - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}" th:classappend="${i == users.number} ? 'active'">
                    <a class="page-link" th:href="@{/users(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!users.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/users(page=${users.number + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
